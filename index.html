  for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.a -= .005; x.globalAlpha = Math.max(p.a, 0); x.fillStyle = p.c; x.font = p.z + 'px serif'; x.fillText('♥', p.x, p.y); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const COL = ['#ff5f86', '#ffb14e', '#ff8fae', '#ffd36a', '#e23b67'];
function burst(n, ox, oy) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.3, v = Math.random() * 7 + 2; P.push({x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, g: .12, a: 1.4, z: 14 + Math.random() * 22, c: COL[i % 5]}); } }

// ---- panes + story ----
const panes = ['#p0', '#pl', '#pq', '#pw'].map($);
const show = el => panes.forEach(p => p.classList.toggle('on', p === el));
let skip = null;
const wait = ms => new Promise(r => { const t = setTimeout(r, ms); skip = () => { clearTimeout(t); r(); }; });
addEventListener('pointerdown', e => { if (skip && !e.target.closest('button')) skip(); });

$('#start').onclick = async () => {
  notify('open', '💌 Usne page khol liya', 'Wo abhi tera proposal dekh rahi hai.');
  $('#hint').textContent = 'skip karne ke liye screen par tap karein';
  $('#p0').classList.remove('on'); await sleep(900);
  const pl = $('#pl');
  for (const [t, big] of LINES) {
    pl.className = 'pane line' + (big ? ' big' : ''); pl.textContent = t;
    void pl.offsetWidth; pl.classList.add('on');
    if (big) burst(6, W / 2, H / 2);
    await wait(2600 + t.length * 50);
    pl.classList.remove('on'); await sleep(900);
  }
  skip = null; $('#hint').style.opacity = 0; show($('#pq'));
};

// ---- the NO button runs away ----
const yes = $('#yes'), no = $('#no'); let tries = 0, last = 0;
function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now(); if (now - last < 400) return; last = now; tries++;
  no.classList.add('run');
  const w = no.offsetWidth, h = no.offsetHeight, r = yes.getBoundingClientRect(); let nx, ny, k = 0;
  do { nx = 12 + Math.random() * (W - w - 24); ny = 12 + Math.random() * (H - h - 24); k++; }
  while (k < 40 && nx < r.right + 24 && nx + w > r.left - 24 && ny < r.bottom + 24 && ny + h > r.top - 24);
  no.style.left = nx + 'px'; no.style.top = ny + 'px';
  yes.style.setProperty('--s', Math.min(1 + tries * .1, 1.9));
  $('#msg').textContent = NOMSG[Math.min(tries - 1, NOMSG.length - 1)];
  if (tries === 1) notify('no', '😄 Usne NO dabane ki koshish ki', 'Button bhaag gaya, ghabrao mat!');
  if (tries >= 10) { no.style.opacity = 0; no.style.pointerEvents = 'none'; $('#msg').textContent = 'Ab sirf ek hi option bacha hai 😌💗'; }
}
['pointerenter', 'pointerdown', 'touchstart', 'mousedown', 'click', 'focus'].forEach(ev => no.addEventListener(ev, dodge, {passive: false}));

yes.onclick = () => {
  notify('yes', '💗 USNE HAAN BOL DIYA!', 'Proposal accept ho gaya! 🎉');
  no.style.display = 'none'; show($('#pw'));
  burst(80, W / 2, H / 2);
  setInterval(() => burst(3, Math.random() * W, -10), 350);
};
